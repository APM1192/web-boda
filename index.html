<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ana & Carlos | Nuestra Boda</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #fdfbf7;
            color: #4a4a4a;
            padding: 50px 20px;
        }
        h1 { color: #8c7853; font-size: 3rem; margin-bottom: 5px; }
        .fecha { font-size: 1.5rem; letter-spacing: 2px; margin-bottom: 30px; }
        .contador { display: flex; justify-content: center; gap: 15px; font-size: 1.2rem; }
        .bloque { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); min-width: 80px; }
        .numero { font-size: 2rem; font-weight: bold; color: #8c7853; display: block; }
    </style>
</head>
<body>

    <p>Nos casamos</p>
    <h1>Ana & Carlos</h1>
    <div class="fecha">30 . 04 . 2027</div>

    <div class="contador">
        <div class="bloque"><span class="numero" id="dias">00</span>Días</div>
        <div class="bloque"><span class="numero" id="horas">00</span>Horas</div>
        <div class="bloque"><span class="numero" id="minutos">00</span>Minutos</div>
        <div class="bloque"><span class="numero" id="segundos">00</span>Segundos</div>
    </div>

    <script>
        // Script básico para que la cuenta atrás funcione en tiempo real
        const fechaBoda = new Date('April 30, 2027 12:00:00').getTime();
        setInterval(function() {
            const ahora = new Date().getTime();
            const distancia = fechaBoda - ahora;
            document.getElementById('dias').innerText = Math.floor(distancia / (1000 * 60 * 60 * 24));
            document.getElementById('horas').innerText = Math.floor((distancia % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            document.getElementById('minutos').innerText = Math.floor((distancia % (1000 * 60 * 60)) / (1000 * 60));
            document.getElementById('segundos').innerText = Math.floor((distancia % (1000 * 60)) / 1000);
        }, 1000);
    </script>
</body>
</html>
